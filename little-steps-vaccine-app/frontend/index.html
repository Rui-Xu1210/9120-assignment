<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little Steps"><meta name="description" content="Your family's vaccination records and reminders. A local student project.">
  <title>Little Steps · Vaccination Tracker</title><link rel="icon" type="image/svg+xml" href="/static/icon.svg"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><button id="child-switch" class="child-switch" aria-haspopup="dialog"><span class="tiny-mark">✳</span><span id="child-label">Your family</span><span class="chevron-down">⌄</span></button><button class="icon-button" id="family-open" aria-label="Open family settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg></button></header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Main navigation">
      <button data-tab="schedule" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></svg><span>Schedule</span></button>
      <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M5 5h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12v18M9 8h6m-6 4h6m-6 4h4"/></svg><span>History</span></button>
      <button data-tab="reminders"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg><span>Reminders</span><i id="reminder-dot" hidden></i></button>
      <button data-tab="family"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><circle cx="18" cy="11" r="2"/><path d="M2 21v-3a7 7 0 0 1 14 0v3m1-6a5 5 0 0 1 5 5v1"/></svg><span>Family</span></button>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
